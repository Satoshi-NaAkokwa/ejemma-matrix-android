name: EJEMMA Matrix Release Build

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "y" | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" || \
          echo "y" | "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ejemma-release.keystore

      - name: Override Gradle memory for CI build
        run: |
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.workers.max=4
          org.gradle.caching=true
          EOF

      - name: Build F-Droid release APK
        env:
          EJEMMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EJEMMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleFdroidRelease --no-daemon -PuseLegacyPackaging=true \
            -Dkotlin.compiler.execution.strategy="in-process"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ejemma-matrix-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
