name: EJEMMA Matrix Release Build

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          components: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ejemma-release.keystore

      - name: Build F-Droid release APK
        env:
          EJEMMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EJEMMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleFdroidRelease --no-daemon -PuseLegacyPackaging=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ejemma-matrix-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
