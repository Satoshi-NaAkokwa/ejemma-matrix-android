name: Build EJEMMA Matrix APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'gplayRelease'
        type: choice
        options:
          - gplayRelease
          - fdroidRelease

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ${{ github.workspace }}/keystore
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/keystore/ejemma-release.keystore

      - name: Build APK
        env:
          EJEMMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EJEMMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EJEMMA_KEYSTORE_PATH: ${{ github.workspace }}/keystore/ejemma-release.keystore
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          ./gradlew :app:assemble${{ github.event.inputs.variant }} --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ejemma-matrix-${{ github.event.inputs.variant }}
          path: app/build/outputs/apk/gplay/release/*.apk
          if-no-files-found: error

      - name: Deploy APK to public download server
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APK_PATH: ${{ secrets.VPS_APK_PATH }}
          VPS_CHECKSUMS_PATH: ${{ secrets.VPS_CHECKSUMS_PATH }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/vps_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          APK_FILE=$(ls app/build/outputs/apk/gplay/release/*.apk | head -n1)
          APK_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
          APK_BASENAME=$(basename "$APK_FILE")
          echo "Deploying $APK_BASENAME (SHA-256: $APK_SHA) to $VPS_USER@$VPS_HOST:$VPS_APK_PATH"

          scp -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/vps_deploy_key "$APK_FILE" "$VPS_USER@$VPS_HOST:$VPS_APK_PATH"
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "echo '$APK_SHA  $APK_BASENAME' > $VPS_CHECKSUMS_PATH && chown www-data:www-data $VPS_APK_PATH $VPS_CHECKSUMS_PATH && chmod 644 $VPS_APK_PATH $VPS_CHECKSUMS_PATH"

          echo "Public download URL: https://ejemma.ugogbe.info/download/$APK_BASENAME"
          echo "SHA-256: $APK_SHA"
