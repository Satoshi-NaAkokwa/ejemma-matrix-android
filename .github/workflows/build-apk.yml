name: Build EJEMMA Matrix APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'gplayRelease'
        type: choice
        options:
          - gplayRelease
          - fdroidRelease

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ${{ github.workspace }}/keystore
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/keystore/ejemma-release.keystore

      - name: Build APK
        env:
          EJEMMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EJEMMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EJEMMA_KEYSTORE_PATH: ${{ github.workspace }}/keystore/ejemma-release.keystore
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          ./gradlew :app:assemble${{ github.event.inputs.variant }} --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ejemma-matrix-${{ github.event.inputs.variant }}
          path: app/build/outputs/apk/gplay/release/*.apk
          if-no-files-found: error

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest app/build/outputs/apk/gplay/release/*.apk --clobber --repo ${{ github.repository }}
